services:
  - type: web
    name: medisync-veut
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://agent-6ae0f05969804e3b07750a--lucky-puppy-bf5db2.netlify.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
